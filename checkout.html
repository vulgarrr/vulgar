<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Negm Apparel</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #000000;
            border-bottom: 1px solid #333333;
        }
        .brand img {
            height: 80px;
            filter: brightness(0) invert(1);
        }
        nav {
            display: flex;
            gap: 20px;
        }
        nav a {
            text-decoration: none;
            color: #ffffff;
            font-size: 14px;
            text-transform: uppercase;
        }
        .checkout-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        .cart-summary {
            margin-bottom: 40px;
        }
        .cart-summary h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333333;
            padding-bottom: 20px;
        }
        .cart-item img {
            width: 100px;
            height: auto;
            margin-right: 20px;
        }
        .cart-item-details {
            flex-grow: 1;
        }
        .cart-total {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
        .checkout-form {
            margin-bottom: 40px;
        }
        .checkout-form h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 16px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
        }
        input::placeholder, textarea::placeholder {
            color: #cccccc;
        }
        .payment-section h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        button {
            background-color: #000000;
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            flex: 1;
        }
        button:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255,255,255,0.2);
        }
        @media (max-width: 768px) {

                padding: 15px;
                flex-direction: column;
                gap: 10px;
            }

                height: 60px;

                gap: 10
