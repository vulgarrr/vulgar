<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Checkout - VULGAR</title>
<link href="https://fonts.googleapis.com/css2?family=Helvetica:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body {
    font-family: 'Helvetica', 'Arial', sans-serif;
    margin: 0;
    background-color: #000;
    color: #fff;
    font-size: 14px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    background-color: #000;
    position: sticky;
    top: 0;
    z-index: 100;
}

header .brand img {
    height: 70px;
    cursor: pointer;
}

header .cart-icon {
    display: flex;
    align-items: center;
    cursor: pointer;
}

header .cart-icon img {
    width: 28px;
    height: 28px;
}

.cart-count {
    background: #fff;
    color: #000;
    padding: 2px 6px;
    border-radius: 50%;
    font-size: 12px;
    margin-left: 6px;
}

.checkout-container {
    max-width: 1000px;
    margin: 100px auto 60px;
    padding: 20px;
}

.cart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}

.cart-item {
    background-color: #111;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    position: relative;
}

.cart-item img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    margin-bottom: 8px;
    border-radius: 6px;
    background-color: #222;
}

.cart-item-name {
    font-size: 14px;
    margin-bottom: 5px;
    font-weight: 500;
}

.cart-item-size, .cart-item-qty, .cart-item-price {
    font-size: 12px;
    margin-bottom: 3px;
    color: #ccc;
}

.cart-item-price {
    font-weight: bold;
    color: #fff;
    margin-top: 8px;
}

.remove-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 24px;
    height: 24px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
}

.remove-btn:hover {
    background: #cc0000;
}

form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 40px;
}

form .full-width {
    grid-column: 1 / -1;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
}

.form-group input, form textarea {
    width: 100%;
    padding: 10px;
    background-color: #000;
    border: 1px solid #fff;
    color: #fff;
    border-radius: 6px;
    font-family: 'Helvetica', sans-serif;
    font-size: 14px;
    box-sizing: border-box;
}

form button {
    background-color: #000;
    border: 1px solid #fff;
    color: #fff;
    padding: 12px 20px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s ease;
}

form button:hover {
    background-color: #fff;
    color: #000;
}

footer {
    text-align: center;
    padding: 15px;
    font-size: 12px;
    margin-top: 60px;
}

footer a {
    color: #ccc;
    text-decoration: none;
    margin: 0 6px;
}

footer a:hover { color: #fff; }

footer p { font-size: 10px; color: #999; }

/* RESPONSIVE */
@media(max-width:768px){
    form {
        grid-template-columns: 1fr;
    }
    .cart-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }
    header {
        padding: 15px 20px;
    }
    .checkout-container {
        margin: 80px auto 40px;
        padding: 15px;
    }
    .cart-item {
        padding: 8px;
    }
    .cart-item img {
        height: 140px;
    }
    .cart-item-name {
        font-size: 12px;
    }
    .cart-item-size, .cart-item-qty, .cart-item-price {
        font-size: 11px;
    }
    .remove-btn {
        width: 22px;
        height: 22px;
        font-size: 11px;
    }
}

@media(max-width:480px){
    .cart-grid {
        grid-template-columns: 1fr;
        gap: 12px;
    }
    header .brand img {
        height: 50px;
    }
    header .cart-icon img {
        width: 24px;
        height: 24px;
    }
    .cart-count {
        font-size: 10px;
        padding: 1px 5px;
    }
    .checkout-container {
        margin: 70px auto 30px;
        padding: 12px;
    }
    .checkout-container h1 {
        font-size: 20px;
        margin-bottom: 20px;
    }
    .cart-item {
        padding: 10px;
    }
    .cart-item img {
        height: 200px;
        margin-bottom: 10px;
    }
    .cart-item-name {
        font-size: 13px;
        margin-bottom: 6px;
    }
    .cart-item-size, .cart-item-qty {
        font-size: 11px;
        margin-bottom: 4px;
    }
    .cart-item-price {
        font-size: 13px;
        margin-top: 6px;
    }
    .remove-btn {
        width: 26px;
        height: 26px;
        font-size: 14px;
        top: 8px;
        right: 8px;
    }
    form button {
        padding: 12px 15px;
        font-size: 13px;
    }
    .form-group input, form textarea {
        padding: 12px;
        font-size: 14px;
    }
    footer {
        padding: 10px;
        font-size: 10px;
    }
    footer a {
        margin: 0 4px;
        display: inline-block;
        padding: 4px 0;
    }
    footer p {
        font-size: 8px;
        margin-top: 8px;
    }
}

@media(max-width:360px){
    .checkout-container {
        padding: 10px;
    }
    .cart-item img {
        height: 180px;
    }
    header .brand img {
        height: 45px;
    }
}
</style>
</head>
<body>

<header>
    <div class="brand" onclick="window.location.href='index.html'">
        <img src="https://ik.imagekit.io/negm/logo%20for%20the%20website.png" alt="VULGAR">
    </div>
    <div class="cart-icon" onclick="window.location.href='checkout.html'">
        <img src="https://img.icons8.com/material-outlined/48/ffffff/shopping-bag--v1.png" alt="Cart">
        <span id="cart-count" class="cart-count">0</span>
    </div>
</header>

<div class="checkout-container">
    <h1>Checkout</h1>

    <div class="cart-grid" id="cart-items">
        <!-- JS populates cart items -->
    </div>
    <div id="cart-total" style="text-align:right; font-weight:bold; margin-bottom:30px; font-size:18px;"></div>

    <form id="checkout-form">
        <div class="form-group">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first-name" required>
        </div>
        <div class="form-group">
            <label for="surname">Surname</label>
            <input type="text" id="surname" name="surname" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" required>
        </div>
        <div class="form-group full-width">
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="4" required></textarea>
        </div>

        <div class="form-group full-width" style="display:flex; gap:20px;">
            <button type="button" onclick="backToCart()" style="flex:1;">Back to Cart</button>
            <button type="submit" style="flex:1;">Confirm Order</button>
        </div>
    </form>
</div>

<footer>
    <a href="privacy.html">Privacy</a>
    <a href="refund.html">Refund</a>
    <a href="contact.html">Contact</a>
    <a href="address.html">Address</a>
    <a href="shipping.html">Shipping</a>
    <a href="terms.html">Terms</a>
    <a href="about.html">About</a>
    <p>&copy; 2023 VULGAR. All rights reserved.</p>
</footer>

<script>
// Load cart from localStorage
let cart = JSON.parse(localStorage.getItem('cart')) || [];
const cartItemsDiv = document.getElementById('cart-items');
const cartCount = document.getElementById('cart-count');
const cartTotalDiv = document.getElementById('cart-total');

function updateCart() {
    cartItemsDiv.innerHTML = '';
    let total = 0;
    if (cart.length === 0) {
        cartItemsDiv.innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding:40px;">Your cart is empty.</p>';
        cartTotalDiv.textContent = 'Total: L.E 0';
        cartCount.textContent = '0';
        return;
    }
    cart.forEach((item, index) => {
        total += item.price * item.quantity;
        const div = document.createElement('div');
        div.className = 'cart-item';
        
        // Handle image URL - check multiple possible properties
        let imageUrl = item.image || item.img || item.imageUrl || item.src || '';
        
        // If no image found, use a placeholder
        if (!imageUrl) {
            console.warn('No image found for item:', item);
            imageUrl = 'https://via.placeholder.com/200x200/111111/ffffff?text=No+Image';
        }
        
        div.innerHTML = `
            <img src="${imageUrl}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/200x200/111111/ffffff?text=No+Image'">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-size">Size: ${item.size}</div>
            <div class="cart-item-qty">Qty: ${item.quantity}</div>
            <div class="cart-item-price">L.E ${item.price * item.quantity}</div>
            <button class="remove-btn" onclick="removeItem(${index})">×</button>
        `;
        cartItemsDiv.appendChild(div);
    });
    cartTotalDiv.textContent = `Total: L.E ${total}`;
    cartCount.textContent = cart.length;
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCart();
}

updateCart();

function backToCart() {
    window.location.href = 'index.html#cart';
}

document.getElementById('checkout-form').addEventListener('submit', function(e){
    e.preventDefault();
    const formData = new FormData(this);
    formData.append('cart', JSON.stringify(cart));

    fetch('https://formspree.io/f/mwpaeola', {
        method: 'POST',
        body: formData,
        headers: { 'Accept': 'application/json' }
    })
    .then(response => {
        if(response.ok){
            localStorage.removeItem('cart');
            window.location.href = 'thanks.html';
        } else {
            alert('There was an error submitting your order.');
        }
    })
    .catch(err => {
        console.error(err);
        alert('There was an error submitting your order.');
    });
});
</script>

</body>
</html>
