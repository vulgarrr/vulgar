<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - VULGAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; font-weight: 300; margin: 0; padding: 0; background-color: #000000; color: #ffffff; font-size: 14px; line-height: 1.5; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background-color: #000000; border-bottom: 1px solid #333333; }
        .brand img { height: 60px; filter: brightness(0) invert(1); }
        nav { display: flex; gap: 20px; }
        nav a { text-decoration: none; color: #ffffff; font-size: 14px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .checkout-container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .cart-summary { margin-bottom: 40px; }
        .cart-item { display: flex; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333333; padding-bottom: 20px; }
        .cart-item img { width: 80px; height: auto; margin-right: 20px; }
        .cart-item-details { flex-grow: 1; }
        .cart-total { font-size: 18px; font-weight: 300; margin-bottom: 20px; }
        .form-section { margin-bottom: 40px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; background-color: #000000; border: 1px solid #ffffff; color: #ffffff; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 14px; box-sizing: border-box; }
        input:focus, textarea:focus { outline: none; border-color: #cccccc; }
        .buttons { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
        button { background-color: #000000; border: 1px solid #ffffff; color: #ffffff; padding: 14px 24px; font-size: 14px; cursor: pointer; text-transform: uppercase; border-radius: 8px; flex: 1; min-width: 150px; min-height: 48px; transition: all 0.3s ease; }
        button:hover { background-color: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
        @media (max-width: 768px) { .cart-item { flex-direction: column; text-align: center; } .cart-item img { margin-right: 0; margin-bottom: 10px; width: 100px; } .buttons { flex-direction: column; gap: 15px; } input, textarea { font-size: 16px; } }
    </style>
    <!-- EmailJS Script -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/emailjs.min.js"></script>
    <script>
        (function() {
            emailjs.init("Z8d_VqphAexkv8xZL");  // Your public key
        })();
    </script>
</head>
<body>
    <header>
        <div class="brand"><a href="index.html"><img src="https://ik.imagekit.io/negm/logo%20for%20the%20website.png" alt="Negm Apparel"></a></div>
        <nav>
            <a href="index.html#product">Shop</a>
            <a href="index.html#cart">Cart</a>
        </nav>
    </header>
    <div class="checkout-container">
        <h1>Checkout</h1>
        <div class="cart-summary">
            <h2>Your Order</h2>
            <div id="cart-items"></div>
            <div id="cart-total" class="cart-total"></div>
        </div>
        <!-- IMPORTANT: no action="" and no method="" -->
        <form id="checkout-form" class="form-section">
            <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name" required>
            </div>
            <div class="form-group">
                <label for="surname">Surname</label>
                <input type="text" id="surname" name="surname" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="4" required></textarea>
            </div>
            <div class="buttons">
                <button type="button" onclick="backToCart()">Back to Cart</button>
                <button type="submit">Confirm Order</button>
            </div>
        </form>
    </div>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function renderCart() {
            const cartItems = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');
            cartItems.innerHTML = '';
            let total = 0;
            cart.forEach((item) => {
                total += item.price * item.quantity;
                cartItems.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="cart-item-details">
                            <div>${item.name}</div>
                            <div>Quantity: ${item.quantity}</div>
                            <div>L.E ${item.price * item.quantity}</div>
                        </div>
                    </div>
                `;
            });
            cartTotal.innerHTML = `<strong>Total: L.E ${total}</strong>`;
        }

        function backToCart() {
            window.location.href = 'index.html#cart';
        }

        document.getElementById('checkout-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            formData.append('cart', JSON.stringify(cart));

            // Submit to Formspree
            fetch('https://formspree.io/f/mwpaeola', {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            })
            .then(response => {
                if (response.ok) {
                    // Clear cart and redirect directly
                    localStorage.removeItem('cart');
                    window.location.href = 'thanks.html';
                } else {
                    throw new Error('Formspree submission failed');
                }
            })
            .catch(error => {
                console.error('Formspree Error:', error);
                // Optionally, you can add an alert here if needed, but no red message
                alert('There was an error submitting your order. Please try again.');
            });
        });

        renderCart();
    </script>
</body>
</html>
