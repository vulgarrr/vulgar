<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VULGAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Goudy+Old+Style&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">  <!-- Placeholder for Luxury Sins font; replace with actual if needed -->
    <style>
        body { font-family: 'Goudy Old Style', serif; font-weight: bold; margin: 0; padding: 0; background-color: #000000; color: #ffffff; font-size: 14px; line-height: 1.5; }
        .video-banner { width: 100%; height: 100vh; overflow: hidden; position: relative; }
        .video-banner video { width: 100%; height: 100%; object-fit: cover; object-position: center; }
        header { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        .brand img { height: 80px; filter: brightness(0) invert(1); }
        nav { display: flex; gap: 20px; }
        nav a { text-decoration: none; color: #ffffff; font-size: 14px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .cart-count { background-color: #ffffff; color: #000000; padding: 2px 6px; border-radius: 50%; font-size: 12px; }
        .shop-now-btn { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.9); border: 1px solid #ffffff; color: #ffffff; padding: 12px 24px; font-size: 16px; cursor: pointer; text-transform: uppercase; border-radius: 8px; box-shadow: 0 2px 4px rgba(255,255,255,0.1); transition: all 0.3s ease; z-index: 12; }
        .shop-now-btn:hover { background-color: rgba(255, 255, 255, 0.1); transform: translate(-50%, -50%) translateY(-2px); box-shadow: 0 4px 8px rgba(255,255,255,0.2); }
        footer { position: absolute; bottom: 0; left: 0; right: 0; z-index: 11; padding: 5px; background-color: transparent; text-align: center; display: flex; flex-wrap: wrap; justify-content: center; }
        footer a { color: #ccc; text-decoration: none; font-size: 10px; margin: 0 5px; transition: color 0.3s ease; }
        footer a:hover { color: #fff; }
        footer p { margin: 0 5px; font-size: 8px; color: #999; }
        .cart-section { display: none; padding: 40px 20px; max-width: 800px; margin: 0 auto; background-color: #000000; color: #ffffff; }
        .cart-item { display: flex; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333333; padding-bottom: 20px; }
        .cart-item img { width: 100px; height: auto; margin-right: 20px; }
        .cart-item-details { flex-grow: 1; }
        .quantity-controls { display: flex; align-items: center; gap: 10px; }
        @media (max-width: 768px) { header { padding: 15px; } nav { gap: 10px; } .shop-now-btn { top: 70%; padding: 10px 20px; font-size: 14px; } .cart-item { flex-direction: column; text-align: center; } .cart-item img { margin-right: 0; margin-bottom: 10px; } footer { flex-direction: row; flex-wrap: wrap; } }
    </style>
</head>
<body>
    <section class="video-banner">
        <video autoplay loop muted playsinline preload="auto" id="bg-video">
            <source src="https://ik.imagekit.io/negm/ssstik.io_1764272048537.mp4" type="video/mp4">
        </video>
        <header>
            <div class="brand"><a href="#product" onclick="goToMain()"><img src="https://ik.imagekit.io/negm/logo%20for%20the%20website.png" alt="Negm Apparel"></a></div>
            <nav>
                <a href="products.html">Shop</a>
                <a href="#cart" onclick="showCart()">Cart <span id="cart-count" class="cart-count">0</span></a>
            </nav>
        </header>
        <button class="shop-now-btn" onclick="window.location.href='products.html'">Shop Now</button>
        <footer>
            <a href="privacy.html">Privacy Policy</a>
            <a href="refund.html">Refund & Exchange Policy</a>
            <a href="contact.html">Contact Us</a>
            <a href="address.html">Address</a>
            <a href="shipping.html">Shipping Policy</a>
            <a href="terms.html">Terms & Conditions</a>
            <a href="about.html">About Us</a>
            <p>&copy; 2023 VULGAR. All rights reserved. Website created by Negm. Copyright 2013.</p>
        </footer>
    </section>
    <section id="cart" class="cart-section">
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <div id="cart-total"></div>
        <button onclick="clearCart()">Clear Cart</button>
        <button onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
        <button onclick="backToShop()">Back to Shop</button>
    </section>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        function updateCartCount() { document.getElementById('cart-count').textContent = cart.length; }
        function showCart() { document.querySelector('.video-banner').style.display = 'none'; document.querySelector('.cart-section').style.display = 'block'; renderCart(); }
        function renderCart() { const cartItems = document.getElementById('cart-items'); const cartTotal = document.getElementById('cart-total'); cartItems.innerHTML = ''; let total = 0; cart.forEach((item, index) => { total += item.price * item.quantity; cartItems.innerHTML += `<div class="cart-item"> <img src="${item.image}" alt="${item.name}"> <div class="cart-item-details"> <div>${item.name} (Size: ${item.size})</div> <div>L.E ${item.price}</div> <div class="quantity-controls"> <button onclick="changeQuantity(${index}, -1)">-</button> <span>${item.quantity}</span> <button onclick="changeQuantity(${index}, 1)">+</button> </div> <button onclick="removeItem(${index})">Remove</button> </div> </div>`; }); cartTotal.innerHTML = `<strong>Total: L.E ${total}</strong>`; }
        function changeQuantity(index, delta) { cart[index].quantity += delta; if (cart[index].quantity <= 0) { cart.splice(index, 1); } localStorage.setItem('cart', JSON.stringify(cart)); updateCartCount(); renderCart(); }
        function removeItem(index) { cart.splice(index, 1); localStorage.setItem('cart', JSON.stringify(cart)); updateCartCount(); renderCart(); }
        function clearCart() { cart = []; localStorage.removeItem('cart'); updateCartCount(); renderCart(); }
        function backToShop() { document.querySelector('.cart-section').style.display = 'none'; document.querySelector('.video-banner').style.display = 'block'; }
        function goToMain() { document.querySelector('.cart-section').style.display = 'none'; document.querySelector('.video-banner').style.display = 'block'; }
        updateCartCount();
    </script>
</body>
</html>
