<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VULGAR</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    margin: 0;
    padding: 0;
    background-color: #000;
    color: #fff;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    background-color: #000;
    border-bottom: 1px solid #333;
  }
  .brand img { height: 60px; filter: brightness(0) invert(1); }
  nav a {
    text-decoration: none;
    color: #fff;
    margin-left: 20px;
    text-transform: uppercase;
  }
  .product-section {
    padding: 40px 20px;
    text-align: center;
  }
  .product-image { width: 300px; height: auto; margin-bottom: 20px; }
  .size-options { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .size-option input { display: none; }
  .size-option label {
    width: 50px; height: 50px; border: 1px solid #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: 0.3s; user-select: none;
  }
  .size-option input:checked + label { background: #fff; color: #000; border-color: #fff; }
  .buttons { display: flex; justify-content: center; gap: 20px; }
  button {
    padding: 10px 20px;
    background: #000; border: 1px solid #fff; color: #fff;
    border-radius: 6px; cursor: pointer; transition: 0.3s;
  }
  button:hover { background: rgba(255,255,255,0.1); }
  #cart-count {
    background: #fff; color: #000; padding: 2px 6px; border-radius: 50%; margin-left: 5px;
  }
</style>
</head>
<body>

<header>
  <div class="brand"><a href="#product"><img src="https://res.cloudinary.com/ds9bldncb/image/upload/v1763589017/logo_for_the_website_pbsszm.png" alt="VULGAR"></a></div>
  <nav>
    <a href="#product">Shop</a>
    <a href="#cart">Cart <span id="cart-count">0</span></a>
  </nav>
</header>

<section id="product" class="product-section">
  <img src="https://res.cloudinary.com/ds9bldncb/image/upload/v1763588866/srk_leather_jacket_ubwf48.png" alt="SRK Leather Jacket" class="product-image">
  <h2>SRK Leather Jacket</h2>
  <p>L.E 1499</p>
  <div class="size-options">
    <div class="size-option">
      <input type="radio" id="size-s" name="jacket-size" value="S">
      <label for="size-s">S</label>
    </div>
    <div class="size-option">
      <input type="radio" id="size-m" name="jacket-size" value="M">
      <label for="size-m">M</label>
    </div>
    <div class="size-option">
      <input type="radio" id="size-l" name="jacket-size" value="L">
      <label for="size-l">L</label>
    </div>
    <div class="size-option">
      <input type="radio" id="size-xl" name="jacket-size" value="XL">
      <label for="size-xl">XL</label>
    </div>
  </div>
  <div class="buttons">
    <button onclick="addToCart()">Add to Cart</button>
    <button onclick="buyNow()">Buy Now</button>
  </div>
</section>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];
updateCartCount();

function getSelectedSize() {
  const radios = document.querySelectorAll('input[name="jacket-size"]:checked');
  return radios.length ? radios[0].value : null;
}

function addToCart() {
  const size = getSelectedSize();
  if(!size) { alert('Select a size'); return; }
  const item = { name: 'SRK Leather Jacket', price: 1499, quantity: 1, size: size, image: 'https://res.cloudinary.com/ds9bldncb/image/upload/v1763588866/srk_leather_jacket_ubwf48.png' };
  cart.push(item);
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartCount();
  alert('Added to cart!');
}

function buyNow() {
  const size = getSelectedSize();
  if(!size) { alert('Select a size'); return; }
  const item = { name: 'SRK Leather Jacket', price: 1499, quantity: 1, size: size, image: 'https://res.cloudinary.com/ds9bldncb/image/upload/v1763588866/srk_leather_jacket_ubwf48.png' };
  cart = [item];
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartCount();
  window.location.href = 'checkout.html';
}

function updateCartCount() {
  document.getElementById('cart-count').textContent = cart.length;
}
</script>

</body>
</html>
