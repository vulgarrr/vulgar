<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VULGAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Goudy+Old+Style&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <!-- Placeholder for Luxury Sins font; replace with actual if needed -->
    <style>
        body {
            font-family: 'Goudy Old Style', serif;
            font-weight: bold;
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-size: 14px;
            line-height: 1.5;
        }
        .video-banner {
            width: 100%;
            height: 70vh; /* Reduced from 100vh to crop vertically, making it not full screen */
            overflow: hidden;
            position: relative;
        }
        .video-banner video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Keeps it cropped to fit, but since height is reduced, it's effectively cropped vertically */
            object-position: center;
        }
        .image-section {
            width: 100%;
            height: auto; /* Let the image determine height, or set to a fixed value if needed */
            overflow: hidden;
            position: relative;
        }
        .image-section img {
            width: 100%;
            height: auto; /* Maintain aspect ratio */
            display: block;
        }
        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .brand img {
            height: 80px;
            filter: brightness(0) invert(1);
        }
        nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        nav a {
            text-decoration: none;
            color: #ffffff;
            font-size: 14px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .cart-link {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .cart-link img {
            width: 28px;
            height: 28px;
        }
        .cart-count {
            background-color: #ffffff;
            color: #000000;
            padding: 2px 6px;
            border-radius: 50%;
            font-size: 12px;
            margin-left: 6px;
            display: none; /* Hidden to make the number disappear */
        }
        .shop-now-btn {
            position: absolute;
            top: 50%; /* Adjusted from 60% to center it in the reduced video height */
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            border: 1px solid #ffffff;
            color: #ffffff;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            z-index: 12;
        }
        .shop-now-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%) translateY(-2px);
            box-shadow: 0 4px 8px rgba(255,255,255,0.2);
        }
        /* Cart Sidebar Styles */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -350px; /* Hidden off-screen initially */
            width: 350px;
            height: 100%;
            background-color: #000000;
            border-left: 1px solid #ffffff;
            z-index: 1000;
            transition: right 0.3s ease;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }
        .cart-sidebar.open {
            right: 0;
        }
        .cart-sidebar .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
        }
        .cart-sidebar h2 {
            margin-top: 0;
            font-size: 20px;
            text-transform: uppercase;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .cart-item .name {
            font-weight: bold;
        }
        .cart-item .price {
            color: #ccc;
        }
        .cart-total {
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0;
            text-align: center;
        }
        .checkout-btn {
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
        }
        .checkout-btn:hover {
            background-color: #ccc;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }
        .overlay.show {
            display: block;
        }
        footer {
            /* Changed to static positioning so it appears at the bottom of the page content and scrolls with the page */
            position: static;
            padding: 5px;
            background-color: transparent;
            text-align: center;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px; /* Added some margin to separate from content above */
        }
        footer a {
            color: #ccc;
            text-decoration: none;
            font-size: 8px; /* Made smaller */
            margin: 0 5px;
            transition: color 0.3s ease;
        }
        footer a:hover {
            color: #fff;
        }
        footer p {
            margin: 0 5px;
            font-size: 6px; /* Made smaller */
            color: #999;
        }
        @media (max-width: 768px) {
            header {
                padding: 20px;
            }
            nav {
                gap: 15px;
            }
            .brand img {
                height: 80px;
            }
            nav a {
                font-size: 14px;
            }
            .cart-link img {
                width: 28px;
                height: 28px;
            }
            .shop-now-btn {
                top: 55%; /* Adjusted for mobile */
                padding: 12px 24px;
                font-size: 16px;
            }
            .cart-sidebar {
                width: 300px;
                right: -300px;
            }
            footer a {
                font-size: 8px; /* Smaller on mobile */
                margin: 0 5px;
            }
            footer p {
                font-size: 6px; /* Smaller on mobile */
                margin: 0 5px;
            }
        }
        @media (max-width: 480px) {
            header {
                padding: 15px;
            }
            .brand img {
                height: 60px;
            }
            nav {
                gap: 12px;
            }
            nav a {
                font-size: 13px;
            }
            .cart-link img {
                width: 20px;
                height: 20px;
            }
            .cart-count {
                font-size: 11px;
                padding: 2px 5px;
            }
            .shop-now-btn {
                top: 60%; /* Adjusted for smaller screens */
                padding: 10px 20px;
                font-size: 14px;
            }
            .cart-sidebar {
                width: 280px;
                right: -280px;
            }
            footer {
                padding: 4px;
            }
            footer a {
                font-size: 7px; /* Even smaller on very small screens */
                margin: 0 4px;
            }
            footer p {
                font-size: 5px; /* Even smaller on very small screens */
                margin: 0 4px;
            }
        }
    </style>
</head>
<body>
    <section class="video-banner">
        <video autoplay loop muted playsinline preload="auto" id="bg-video">
            <source src="https://ik.imagekit.io/negm/ssstik.io_1764272048537.mp4" type="video/mp4">
        </video>
        <header>
            <div class="brand"><a href="#product" onclick="goToMain()"><img src="https://ik.imagekit.io/negm/logo%20for%20the%20website.png" alt="Negm Apparel"></a></div>
            <nav>
                <a href="products.html">Shop</a>
                <div class="cart-link" onclick="toggleCart()">
                    <img src="https://img.icons8.com/material-outlined/48/ffffff/shopping-bag--v1.png" alt="Cart">
                    <span id="cart-count" class="cart-count">0</span>
                </div>
            </nav>
        </header>
        <button class="shop-now-btn" onclick="window.location.href='products.html'">Shop Now</button>
    </section>
    <section class="image-section">
        <img src="https://ik.imagekit.io/negm/horizontal%20website%20pic.png" alt="Horizontal Website Pic">
    </section>
    <!-- Cart Sidebar -->
    <div class="overlay" id="cart-overlay" onclick="closeCart()"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <button class="close-btn" onclick="closeCart()">&times;</button>
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <div class="cart-total" id="cart-total">Total: $0.00</div>
        <button class="checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
    </div>
    <footer>
        <a href="privacy.html">Privacy</a>
        <a href="refund.html">Refund</a>
        <a href="contact.html">Contact</a>
        <a href="address.html">Address</a>
        <a href="shipping.html">Shipping</a>
        <a href="terms.html">Terms</a>
        <a href="about.html">About</a>
        <p>&copy; 2023 VULGAR. All rights reserved. Website created by Negm. Copyright 2013.</p>
    </footer>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        
        function updateCartCount() {
            document.getElementById('cart-count').textContent = cart.length;
        }
        
        function goToMain() {
            /* No action needed, already on main */
        }
        
        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
            renderCart();
        }
        
        function closeCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }
        
        function renderCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const cartTotalDiv = document.getElementById('cart-total');
            cartItemsDiv.innerHTML = '';
            let total = 0;
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p>Your cart is empty.</p>';
            } else {
                cart.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'cart-item';
                    itemDiv.innerHTML = `
                        <span class="name">${item.name}</span>
                        <span class="price">$${item.price}</span>
                    `;
                    cartItemsDiv.appendChild(itemDiv);
                    total += parseFloat(item.price);
                });
            }
            cartTotalDiv.textContent = `Total: $${total.toFixed(2)}`;
        }
        
        function proceedToCheckout() {
            window.location.href = 'checkout.html';
        }
        
        // Swipe detection for mobile
        let startX = 0;
        let currentX = 0;
        const sidebar = document.getElementById('cart-sidebar');
        
        sidebar.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });
        
        sidebar.addEventListener('touchmove', (e) => {
            currentX = e.touches[0].clientX;
        });
        
        sidebar.addEventListener('touchend', () => {
            if (startX - currentX > 50) { // Swipe left threshold
                closeCart();
            }
            startX = 0;
            currentX = 0;
        });
        
        updateCartCount();
    </script>
</body>
</html>
