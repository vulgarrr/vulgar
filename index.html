<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VULGAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Goudy+Old+Style&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">  <!-- Placeholder for Luxury Sins font; replace with actual if needed -->
    <style>
        body { font-family: 'Goudy Old Style', serif; font-weight: bold; margin: 0; padding: 0; background-color: #000000; color: #ffffff; font-size: 14px; line-height: 1.5; }
        .video-banner { width: 100%; height: 100vh; overflow: hidden; position: relative; }
        .video-banner video { width: 100%; height: 100%; object-fit: cover; object-position: center; }
        header { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        .brand img { height: 80px; filter: brightness(0) invert(1); }
        nav { display: flex; gap: 20px; }
        nav a { text-decoration: none; color: #ffffff; font-size: 14px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .cart-count { background-color: #ffffff; color: #000000; padding: 2px 6px; border-radius: 50%; font-size: 12px; }
        .shop-now-btn { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(0, 0, 0, 0.9); border: 1px solid #ffffff; color: #ffffff; padding: 12px 24px; font-size: 16px; cursor: pointer; text-transform: uppercase; border-radius: 8px; box-shadow: 0 2px 4px rgba(255,255,255,0.1); transition: all 0.3s ease; z-index: 12; }
        .shop-now-btn:hover { background-color: rgba(255, 255, 255, 0.1); transform: translate(-50%, -50%) translateY(-2px); box-shadow: 0 4px 8px rgba(255,255,255,0.2); }
        footer { position: absolute; bottom: 0; left: 0; right: 0; z-index: 11; padding: 5px; background-color: transparent; text-align: center; display: flex; flex-wrap: wrap; justify-content: center; }
        footer a { color: #ccc; text-decoration: none; font-size: 10px; margin: 0 5px; transition: color 0.3s ease; }
        footer a:hover { color: #fff; }
        footer p { margin: 0 5px; font-size: 8px; color: #999; }
        @media (max-width: 768px) { 
            header { padding: 15px; } 
            nav { gap: 10px; } 
            .brand img { height: 60px; } 
            nav a { font-size: 12px; } 
            .shop-now-btn { top: 70%; padding: 10px 20px; font-size: 14px; } 
            footer { flex-direction: column; align-items: center; } 
            footer a { margin: 2px 0; } 
            footer p { margin: 5px 0; } 
        }
        @media (max-width: 480px) { 
            header { padding: 10px; } 
            .brand img { height: 50px; } 
            nav { gap: 8px; } 
            nav a { font-size: 10px; } 
            .cart-count { font-size: 10px; padding: 1px 4px; } 
            .shop-now-btn { top: 75%; padding: 8px 16px; font-size: 12px; } 
            footer { padding: 3px; } 
            footer a { font-size: 8px; margin: 1px 0; } 
            footer p { font-size: 6px; margin: 3px 0; } 
        }
    </style>
</head>
<body>
    <section class="video-banner">
        <video autoplay loop muted playsinline preload="auto" id="bg-video">
            <source src="https://ik.imagekit.io/negm/ssstik.io_1764272048537.mp4" type="video/mp4">
        </video>
        <header>
            <div class="brand"><a href="#product" onclick="goToMain()"><img src="https://ik.imagekit.io/negm/logo%20for%20the%20website.png" alt="Negm Apparel"></a></div>
            <nav>
                <a href="products.html">Shop</a>
                <a href="checkout.html">Cart <span id="cart-count" class="cart-count">0</span></a>
            </nav>
        </header>
        <button class="shop-now-btn" onclick="window.location.href='products.html'">Shop Now</button>
        <footer>
            <a href="privacy.html">Privacy</a>
            <a href="refund.html">Refund</a>
            <a href="contact.html">Contact</a>
            <a href="address.html">Address</a>
            <a href="shipping.html">Shipping</a>
            <a href="terms.html">Terms</a>
            <a href="about.html">About</a>
            <p>&copy; 2023 VULGAR. All rights reserved. Website created by Negm. Copyright 2013.</p>
        </footer>
    </section>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        function updateCartCount() { document.getElementById('cart-count').textContent = cart.length; }
        function goToMain() { /* No action needed, already on main */ }
        updateCartCount();
    </script>
</body>
</html>
