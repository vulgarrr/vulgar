<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VULGAR Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; margin-bottom: 30px; }
    form { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
    input { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #fff; background: #111; color: #fff; }
    button { padding: 12px; font-size: 16px; background: #000; border: 1px solid #fff; color: #fff; border-radius: 6px; cursor: pointer; }
    button:hover { background: #111; }
  </style>
</head>
<body>

  <h1>VULGAR Checkout</h1>

  <form id="checkoutForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <input type="text" name="customer_name" placeholder="Full Name" required>
    <input type="email" name="customer_email" placeholder="Email" required>
    <input type="text" name="product_name" id="product_name" readonly>
    <input type="number" name="quantity" id="quantity" readonly>
    <input type="text" name="total_price" id="total_price" readonly>
    <button type="submit">Confirm Order</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    // Initialize EmailJS
    emailjs.init("Z8d_VqphAexkv8xZL"); // your public key

    // Load cart from localStorage and prefill checkout form
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    if(cart.length > 0){
      const item = cart[0]; // For simplicity, only first item in cart
      document.getElementById('product_name').value = item.name + " (Size: " + item.size + ")";
      document.getElementById('quantity').value = item.quantity;
      document.getElementById('total_price').value = item.price * item.quantity + " L.E";
    }

    document.getElementById("checkoutForm").addEventListener("submit", function(e){
      e.preventDefault();

      const orderId = "VG" + Math.floor(Math.random() * 100000);

      emailjs.send("service_gmail_vulgar", "template_wjjp954", {
        customer_name: this.customer_name.value,
        customer_email: this.customer_email.value,
        product_name: this.product_name.value,
        quantity: this.quantity.value,
        total_price: this.total_price.value,
        order_id: orderId
      })
      .then(() => {
        alert("Order confirmed! Check your email 📩");
        this.submit(); // submit to Formspree after email
        localStorage.removeItem('cart'); // clear cart after checkout
      })
      .catch((error) => {
        alert("Email failed but order submitted.");
        console.error(error);
        this.submit();
        localStorage.removeItem('cart');
      });
    });
  </script>

</body>
</html>
