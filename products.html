<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - VULGAR</title>
    <link href="https://fonts.googleapis.com/css2?family=Goudy+Old+Style&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Goudy Old Style', serif; font-weight: bold; margin: 0; padding: 0; background-color: #000000; color: #ffffff; font-size: 14px; line-height: 1.5; }
        header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; padding: 20px; background-color: rgba(0, 0, 0, 0.9); }
        .brand img { height: 80px; filter: brightness(0) invert(1); }
        nav { display: flex; gap: 20px; }
        nav a { text-decoration: none; color: #ffffff; font-size: 14px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .cart-count { background-color: #ffffff; color: #000000; padding: 2px 6px; border-radius: 50%; font-size: 12px; }
        .product-section { padding: 120px 20px 60px; text-align: center; }  /* Added bottom padding for gap before footer */
        .products-grid { display: grid; gap: 40px; justify-items: center; }
        @media (min-width: 769px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
        .product { max-width: 300px; text-align: center; cursor: pointer; }
        .product-image { width: 100%; height: auto; margin-bottom: 10px; transition: transform 0.4s ease; }
        .product.clicked .product-image { animation: pop 0.4s ease; }
        .product-name { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .product-details { opacity: 0; visibility: hidden; transform: scale(0.8) translateY(20px); transition: opacity 0.5s ease, visibility 0.5s ease, transform 0.5s ease; margin-bottom: 20px; }
        .product-details.show { opacity: 1; visibility: visible; transform: scale(1) translateY(0); animation: bounceIn 0.5s ease; }
        .product-details.hide { animation: slideOut 0.5s ease; }
        .product-price { font-size: 16px; margin-bottom: 15px; }
        .size-options { margin-bottom: 15px; }
        select { background-color: #000000; border: 1px solid #ffffff; color: #ffffff; padding: 6px; font-size: 12px; border-radius: 20px; width: 100%; max-width: 180px; cursor: pointer; }
        .buttons { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        button { background: linear-gradient(145deg, #000000, #222222); border: 1px solid #ffffff; color: #ffffff; padding: 8px 16px; font-size: 12px; cursor: pointer; text-transform: uppercase; border-radius: 25px; transition: all 0.3s ease; box-shadow: 0 4px 8px rgba(255,255,255,0.1); }
        button:hover { background: linear-gradient(145deg, #ffffff, #cccccc); color: #000000; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(255,255,255,0.2); }
        .cart-section { display: none; padding: 40px 20px; max-width: 800px; margin: 0 auto; background-color: #000000; color: #ffffff; }
        .cart-item { display: flex; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333333; padding-bottom: 20px; }
        .cart-item img { width: 100px; height: auto; margin-right: 20px; }
        .cart-item-details { flex-grow: 1; }
        .quantity-controls { display: flex; align-items: center; gap: 10px; }
        .notification { position: fixed; top: 20px; right: 20px; background-color: #ffffff; color: #000000; padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); font-weight: bold; z-index: 1000; opacity: 0; transition: opacity 0.3s ease; }
        .notification.show { opacity: 1; }
        footer { padding: 5px; background-color: transparent; text-align: center; position: relative; display: flex; justify-content: center; } /* Removed flex-wrap to keep everything in one line */
        footer a { color: #ccc; text-decoration: none; font-size: 8px; margin: 0 5px; transition: color 0.3s ease; } /* Made font smaller */
        footer p { margin: 0 5px; font-size: 6px; color: #999; } /* Made font smaller */
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3) translateY(50px); } 50% { opacity: 1; transform: scale(1.05) translateY(-10px); } 70% { transform: scale(0.9) translateY(5px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes slideOut { 0% { opacity: 1; transform: scale(1) translateY(0); } 100% { opacity: 0; transform: scale(0.8) translateY(-20px); } }
        @media (max-width: 768px) { header { padding: 15px; } nav { gap: 10px; } .product { max-width: 100%; } .buttons { flex-direction: column; align-items: center; } .cart-item { flex-direction: column; text-align: center; } .cart-item img { margin-right: 0; margin-bottom: 10px; } footer { flex-direction: row; } } /* Adjusted for mobile, but kept no wrap */
    </style>
</head>
<body>

    <section class="product-section">

            <!-- Product 1: LJ-1 (SRK Leather Jacket) -->
            <div class="product" onclick="toggleDetails('jacket')">
                <img src="https://ik.imagekit.io/negm/srk%20leather%20jacket.png" alt="LJ-1" class="product-image" loading="lazy">

            <!-- Product 3: H-1 (Vul Hoodie) -->
            <div class="product" onclick="toggleDetails('vulhoodie')">
                <img src="https://ik.imagekit.io/negm/vul%20hoodie%20black.png" alt="H-1" class="product-image" loading="lazy">
                <div class="product-name">H-1</div>

                        <select id="vulhoodie-size" onclick="event.stopPropagation();">

                    </div>
                    <div class="buttons">
                        <button onclick="addToCart('vulhoodie'); event.stopPropagation();">Add to Cart</button>
                        <button onclick="buyNow('vulhoodie'); event.stopPropagation();">Buy Now</button>
                    </div>
                </div>
            </div>
            <!-- Product 4: DP-1 (Vulgar Custom Denim) -->
            <div class="product" onclick="toggleDetails('denim')">
                <img src="https://ik.imagekit.io/negm/vulgar%20denim%20pants.png" alt="DP-1" class="product-image" loading="lazy">
                <div class="product-name">DP-1</div>

                    <div class="buttons">

    </section>
    <section id="cart" class="cart-section">
        <h2>Your Cart</h2>
        <div id="cart-items"></div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        function updateCartCount() { document.getElementById('cart-count').textContent = cart.length; }
        function getSelectedSize(productType) { const select = document.getElementById(`${productType}-size`); return select.value; }
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            setTimeout(() => { notification.classList.remove('show'); }, 3000);
        }
        function toggleDetails(productType) {
            // Hide all product details first
            const allDetails = document.querySelectorAll('.product-details');
            allDetails.forEach(detail => {
                if (detail.classList.contains('show')) {
                    detail.classList.add('hide');
                    setTimeout(() => { detail.classList.remove('show', 'hide'); }, 500);
                }
            });
            // Then show the clicked product's details
            const product = document.querySelector(`[onclick="toggleDetails('${productType}')"]`);
            const details = document.getElementById(`${productType}-details`);
            if (!details.classList.contains('show')) {
                details.classList.add('show');
                product.classList.add('clicked');
                setTimeout(() => { product.classList.remove('clicked'); }, 400);
            }
        }
        function addToCart(productType) { 
            const selectedSize = getSelectedSize(productType); 
            if (!selectedSize) { showNotification('Please select a size.'); return; } 
            let item; 
            if (productType === 'jacket') { item = { name: 'LJ-1', price: 1499, image: 'https://ik.imagekit.io/negm/srk%20leather%20jacket.png', quantity: 1, size: selectedSize }; } 
            else if (productType === 'sweatpants') { item = { name: 'MP-1', price: 799, image: 'https://ik.imagekit.io/negm/vulgar%20black%20sweatpants%20basic.png', quantity: 1, size: selectedSize }; } 
            else if (productType === 'vulhoodie') { item = { name: 'H-1', price: 899, image: 'https://ik.imagekit.io/negm/vul%20hoodie%20black.png', quantity: 1, size: selectedSize }; } 
            else if (productType === 'denim') { item = { name: 'DP-1', price: 799, image: 'https://ik.imagekit.io/negm/vulgar%20denim%20pants.png', quantity: 1, size: selectedSize }; } 
            cart.push(item); 
            localStorage.setItem('cart', JSON.stringify(cart)); 
            updateCartCount(); 
            showNotification('Item added to your cart!'); 
        }
        function buyNow(productType) { 
            const selectedSize = getSelectedSize(productType); 
            if (!selectedSize) { showNotification('Please select a size.'); return; } 
            let item; 
            if (productType === 'jacket') { item = { name: 'LJ-1', price: 1499, image: 'https://ik.imagekit.io/negm/srk%20leather%20jacket.png', quantity: 1, size: selectedSize }; } 
            else if (productType === 'sweatpants') { item = { name: 'MP-1', price: 799, image: 'https://ik.imagekit.io/negm/vulgar%20black%20sweatpants%20basic.png', quantity: 1, size: selectedSize }; } 
            else if (productType === 'vulhoodie') { item = { name: 'H-1', price: 899, image: 'https://ik.imagekit.io/negm/vul%20hoodie%20black.png', quantity: 1, size: selectedSize }; } 
            else if (productType === 'denim') { item = { name: 'DP-1', price: 799, image: 'https://ik.imagekit.io/negm/vulgar%20denim%20pants.png', quantity: 1, size: selectedSize }; } 
            cart = [item]; 
            localStorage.setItem('cart', JSON.stringify(cart)); 
            updateCartCount(); 
            window.location.href = 'checkout.html'; 
        }
        function showCart() { document.querySelector('.product-section').style.display = 'none'; document.querySelector('.cart-section').style.display = 'block'; renderCart(); }
        function renderCart() { const cartItems = document.getElementById('cart-items'); const cartTotal = document.getElementById('cart-total'); cartItems.innerHTML = ''; let total = 0
