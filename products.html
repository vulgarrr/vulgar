<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - VULGAR</title>

<link href="https://fonts.googleapis.com/css2?family=Goudy+Old+Style&display=swap" rel="stylesheet">

<style>
/* ---------------- GLOBAL ---------------- */
body {
    font-family: 'Goudy Old Style', serif;
    font-weight: bold;
    margin: 0;
    background-color: #000;
    color: #fff;
    font-size: 14px;
}

/* ---------------- HEADER ---------------- */
header {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 20px 30px;
    display: flex;
    align-items: center;          /* FIX: vertical alignment */
    justify-content: space-between;
    background: rgba(0,0,0,0.9);
    z-index: 100;
}

.brand img {
    height: 70px;
    display: block;
    filter: brightness(0) invert(1);
}

nav {
    display: flex;
    align-items: center;          /* FIX: nav alignment */
    gap: 20px;
}

nav a {
    color: #fff;
    text-decoration: none;
    text-transform: uppercase;
}

.cart-count {
    background: #fff;
    color: #000;
    padding: 2px 6px;
    border-radius: 50%;
    font-size: 12px;
}

/* ---------------- PRODUCTS ---------------- */
.product-section {
    padding: 140px 30px 60px;
}

.products-grid {
    display: grid;
    gap: 40px;
    justify-items: center;
}

@media (min-width: 769px) {
    .products-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 768px) {
    .products-grid { grid-template-columns: repeat(2, 1fr); }
}

.product {
    max-width: 300px;
    text-align: center;
}

.product-image {
    width: 100%;
    cursor: pointer;
}

.product-name {
    margin: 10px 0;
    font-size: 18px;
    cursor: pointer;
}

.product-details {
    display: none;
    margin-top: 10px;
}

.product-details.show {
    display: block;
}

select {
    background: #000;
    border: 1px solid #fff;
    color: #fff;
    padding: 6px;
    width: 100%;
    margin-bottom: 10px;
}

button {
    background: #000;
    border: 1px solid #fff;
    color: #fff;
    padding: 8px;
    width: 100%;
    cursor: pointer;
    margin-bottom: 8px;
}

button:hover {
    background: #fff;
    color: #000;
}

/* ---------------- NOTIFICATION ---------------- */
.notification {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #fff;
    color: #000;
    padding: 10px 20px;
    border-radius: 6px;
    display: none;
    z-index: 999;
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="https://ik.imagekit.io/negm/logo%20for%20the%20website.png" alt="VULGAR">
    </div>
    <nav>
        <a href="products.html">Shop</a>
        <a href="#cart">Cart <span id="cart-count" class="cart-count">0</span></a>
    </nav>
</header>

<section class="product-section">
<div class="products-grid">

<!-- LJ-1 -->
<div class="product">
<img src="https://ik.imagekit.io/negm/srk%20leather%20jacket.png" class="product-image" onclick="toggleDetails('jacket')">
<div class="product-name" onclick="toggleDetails('jacket')">LJ-1</div>
<div class="product-details" id="jacket-details">
<div>L.E 1499</div>
<select id="jacket-size" onclick="event.stopPropagation()">
<option value="">Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option>
</select>
<button onclick="addToCart('LJ-1',1499,'jacket');event.stopPropagation()">Add to Cart</button>
<button onclick="buyNow('LJ-1',1499,'jacket');event.stopPropagation()">Buy Now</button>
</div>
</div>

<!-- MP-1 -->
<div class="product">
<img src="https://ik.imagekit.io/negm/vulgar%20black%20sweatpants%20basic.png" class="product-image" onclick="toggleDetails('sweatpants')">
<div class="product-name" onclick="toggleDetails('sweatpants')">MP-1</div>
<div class="product-details" id="sweatpants-details">
<div>L.E 799</div>
<select id="sweatpants-size" onclick="event.stopPropagation()">
<option value="">Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option>
</select>
<button onclick="addToCart('MP-1',799,'sweatpants');event.stopPropagation()">Add to Cart</button>
<button onclick="buyNow('MP-1',799,'sweatpants');event.stopPropagation()">Buy Now</button>
</div>
</div>

<!-- H-1 -->
<div class="product">
<img src="https://ik.imagekit.io/negm/vul%20hoodie%20black.png" class="product-image" onclick="toggleDetails('hoodie')">
<div class="product-name" onclick="toggleDetails('hoodie')">H-1</div>
<div class="product-details" id="hoodie-details">
<div>L.E 899</div>
<select id="hoodie-size" onclick="event.stopPropagation()">
<option value="">Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option>
</select>
<button onclick="addToCart('H-1',899,'hoodie');event.stopPropagation()">Add to Cart</button>
<button onclick="buyNow('H-1',899,'hoodie');event.stopPropagation()">Buy Now</button>
</div>
</div>

<!-- DP-1 -->
<div class="product">
<img src="https://ik.imagekit.io/negm/vulgar%20denim%20pants.png" class="product-image" onclick="toggleDetails('denim')">
<div class="product-name" onclick="toggleDetails('denim')">DP-1</div>
<div class="product-details" id="denim-details">
<div>L.E 799</div>
<select id="denim-size" onclick="event.stopPropagation()">
<option value="">Select Size</option><option>S</option><option>M</option><option>L</option><option>XL</option>
</select>
<button onclick="addToCart('DP-1',799,'denim');event.stopPropagation()">Add to Cart</button>
<button onclick="buyNow('DP-1',799,'denim');event.stopPropagation()">Buy Now</button>
</div>
</div>

</div>
</section>

<div id="notification" class="notification"></div>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];

function updateCartCount() {
    document.getElementById('cart-count').textContent = cart.length;
}

function toggleDetails(id) {
    document.getElementById(id + '-details').classList.toggle('show');
}

function addToCart(name, price, id) {
    const size = document.getElementById(id + '-size').value;
    if (!size) return notify('Please select a size');

    cart.push({ name, price, size, quantity: 1 });
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartCount();
    notify('Added to cart');
}

function buyNow(name, price, id) {
    addToCart(name, price, id);
    window.location.href = 'checkout.html';
}

function notify(msg) {
    const n = document.getElementById('notification');
    n.textContent = msg;
    n.style.display = 'block';
    setTimeout(() => n.style.display = 'none', 2000);
}

updateCartCount();
</script>

</body>
</html>
